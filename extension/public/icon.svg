<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="gauge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bg)"/>
  <!-- Finger shape -->
  <g transform="translate(64,68) rotate(-15)">
    <!-- Finger body -->
    <rect x="-10" y="-35" width="20" height="55" rx="10" fill="#1e1b4b" opacity="0.9"/>
    <!-- Finger tip -->
    <ellipse cx="0" cy="-38" rx="11" ry="12" fill="#1e1b4b" opacity="0.9"/>
    <!-- Knuckle lines -->
    <line x1="-8" y1="-15" x2="8" y2="-15" stroke="#312e81" stroke-width="1.5" opacity="0.6"/>
    <line x1="-8" y1="5" x2="8" y2="5" stroke="#312e81" stroke-width="1.5" opacity="0.6"/>
    <!-- Pedometer/gauge on middle knuckle -->
    <circle cx="0" cy="-8" r="9" fill="#030712" stroke="url(#gauge)" stroke-width="1.5"/>
    <circle cx="0" cy="-8" r="6" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" stroke-dasharray="2 2"/>
    <!-- Gauge needle -->
    <line x1="0" y1="-8" x2="4" y2="-13" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <!-- Gauge center dot -->
    <circle cx="0" cy="-8" r="1.5" fill="#fbbf24"/>
    <!-- Tiny "FT" text on gauge -->
    <text x="0" y="-4" text-anchor="middle" fill="#22d3ee" font-size="3" font-family="monospace" font-weight="bold">FT</text>
  </g>
  <!-- Motion lines -->
  <g stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <path d="M 20 45 Q 15 50 20 55" fill="none"/>
    <path d="M 14 38 Q 9 43 14 48" fill="none"/>
    <path d="M 26 52 Q 21 57 26 62" fill="none"/>
  </g>
  <!-- Mile marker -->
  <g transform="translate(90,30)">
    <rect x="-12" y="-8" width="24" height="16" rx="3" fill="#030712" opacity="0.8"/>
    <text x="0" y="2" text-anchor="middle" fill="#fbbf24" font-size="8" font-family="monospace" font-weight="bold">MI</text>
  </g>
</svg>
