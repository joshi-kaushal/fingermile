services:
  fingermile:
    build:
      context: ./backend
      dockerfile: Dockerfile.compose
    container_name: fingermile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/fingermile
      CLERK_JWKS_URL: https://relaxed-fox-20.clerk.accounts.dev/.well-known/jwks.json
      BYPASS_AUTH: "false"
